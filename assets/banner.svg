<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Itaú 360° — inteligência política, Brasil">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" fill="#0a2a6e"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="8" fill="#ec7000"/>

  <!-- dial gigante ao fundo -->
  <g transform="translate(1120 175) scale(6.2) translate(-24 -24)" opacity=".16" fill="none" stroke="#fff">
    <circle cx="24" cy="24" r="21" stroke-width="1.2"/>
    <path d="M24 3v4M45 24h-4M24 45v-4M3 24h4" stroke-width="1.2"/>
  </g>
  <g transform="translate(1120 175) scale(6.2) translate(-24 -24)" fill="none">
    <path d="M24 3A21 21 0 1 1 3 24" stroke="#ec7000" stroke-width="1.6" stroke-linecap="round"/>
    <text x="24" y="28.5" text-anchor="middle" font-family="DejaVu Sans Mono,Consolas,monospace" font-weight="700" font-size="12.5" fill="#fff">360</text>
  </g>

  <!-- marca -->
  <g transform="translate(90 92)">
    <rect x="0" y="0" width="14" height="14" fill="#ec7000"/>
    <text x="28" y="13" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="17" font-weight="600" fill="#ffc999" letter-spacing="3">INTELIGÊNCIA POLÍTICA · BRASIL</text>
  </g>
  <text x="86" y="200" font-family="Arial Narrow,Liberation Sans Narrow,Helvetica Neue,Arial,sans-serif" font-size="104" font-weight="700" fill="#fff" letter-spacing="-1">ITAÚ <tspan fill="#ec7000">360°</tspan></text>
  <text x="90" y="250" font-family="Georgia,DejaVu Serif,serif" font-size="23" fill="#e8ecf6">Primeiros 100 dias do governo eleito em 2026 e o que chega ao banco.</text>
  <text x="90" y="288" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="16" fill="#9fb3dc">■ fato documentado   ·   □ hipótese ou a verificar</text>
</svg>
